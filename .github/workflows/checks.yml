name: Checks

# Runs on every push to main, on every pull request (including Dependabot's), and weekly.
# The weekly run matters: it catches a newly published vulnerability in a dependency even when nothing changed here.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python gui.py --selftest

  security:
    name: security scan and dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install bandit pip-audit
      # Fail on anything of medium severity or higher. Low findings here are normal patterns (fixed-argument subprocess calls, etc.).
      - run: bandit -r steamcase.py gui.py widgets.py -ll
      # Known vulnerabilities in the pinned build dependencies.
      - run: pip-audit -r requirements-build.txt --no-deps --disable-pip

  fuzz:
    name: random-click robot (GUI fuzzer)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: python -m pip install -r requirements-build.txt
      - run: xvfb-run -a python -u tests/fuzz_gui.py --seeds 4 --steps 120
