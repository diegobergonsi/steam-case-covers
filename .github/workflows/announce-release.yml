name: Announce a release

# Sends the Discord message for a release that already exists (the release workflow does it by itself for new ones).
# Run it by hand from the Actions tab with the tag, for example v1.5.0: to try the webhook, or to send a message that failed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, exactly like v1.5.0 (a v, then three numbers separated by dots)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1      # the branch it runs on: its changelog holds every version, old tags have no script
        with:
          persist-credentials: false
      - name: Announce on Discord      # no continue-on-error here: when you run it by hand, a problem must show as a red job
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "The DISCORD_WEBHOOK_URL secret is not set."; exit 1; fi
          python3 tools/release_message.py announce "$TAG" > discord.json
          curl --fail --silent --show-error -H "Content-Type: application/json" --data @discord.json "$DISCORD_WEBHOOK_URL"
