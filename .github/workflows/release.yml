name: Build and release

# Runs when you push a version tag (git tag v1.0.0 && git push --tags),
# or by hand from the Actions tab (builds only, no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: SteamCaseCovers-windows.exe
          - os: macos-latest
            asset: SteamCaseCovers-macos.zip
          - os: ubuntu-latest
            asset: SteamCaseCovers-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow pyinstaller
      - name: Selftest (source)
        run: python gui.py --selftest
      - name: Build
        run: pyinstaller --noconfirm steamcase.spec

      - name: Selftest (built app) - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SteamCaseCovers.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          Copy-Item dist\SteamCaseCovers.exe ${{ matrix.asset }}
      - name: Selftest (built app) - macOS
        if: runner.os == 'macOS'
        run: |
          dist/SteamCaseCovers.app/Contents/MacOS/SteamCaseCovers --selftest
          ditto -c -k --keepParent dist/SteamCaseCovers.app ${{ matrix.asset }}
      - name: Selftest (built app) - Linux
        if: runner.os == 'Linux'
        run: |
          dist/SteamCaseCovers --selftest
          cp dist/SteamCaseCovers ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
