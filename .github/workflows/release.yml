name: Build and release

# Runs when you push a version tag (git tag v1.0.0 && git push --tags),
# or by hand from the Actions tab (builds only, no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: SteamCaseCovers-windows.exe
          - os: macos-latest
            asset: SteamCaseCovers-macos.zip
          - os: ubuntu-latest
            asset: SteamCaseCovers-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Selftest (source)
        run: python gui.py --selftest
      - name: Build
        run: pyinstaller --noconfirm steamcase.spec

      - name: Selftest (built app) - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SteamCaseCovers.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          Copy-Item dist\SteamCaseCovers.exe ${{ matrix.asset }}
      - name: Selftest (built app) - macOS
        if: runner.os == 'macOS'
        run: |
          # Apple Silicon refuses unsigned programs, and a downloaded unsigned app is reported as "damaged".
          # An ad-hoc signature (free, no Apple account) turns that into the normal "unidentified developer" prompt.
          xattr -cr dist/SteamCaseCovers.app
          codesign --force --deep --sign - dist/SteamCaseCovers.app
          codesign --verify --deep --strict --verbose=2 dist/SteamCaseCovers.app
          dist/SteamCaseCovers.app/Contents/MacOS/SteamCaseCovers --selftest
          ditto -c -k --keepParent dist/SteamCaseCovers.app ${{ matrix.asset }}
      - name: Selftest (built app) - Linux
        if: runner.os == 'Linux'
        run: |
          dist/SteamCaseCovers --selftest
          cp dist/SteamCaseCovers ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # lets GitHub sign the build certificates below
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Signed build provenance (who built each file, from which commit)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: assets/*
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}   # v0.x = pre-release until v1.0.0
