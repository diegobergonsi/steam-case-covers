name: Build and release

# Runs when you push a version tag (git tag v1.0.0 && git push --tags),
# or by hand from the Actions tab (builds only, no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: SteamCaseCovers-windows.exe
          - os: macos-latest
            asset: SteamCaseCovers-macos.zip
          - os: ubuntu-latest
            asset: SteamCaseCovers-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - name: Stamp the version into the build
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: echo "$TAG" > assets/version.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Selftest (source)
        run: python gui.py --selftest
      - name: Build
        run: pyinstaller --noconfirm steamcase.spec

      - name: Selftest (built app) - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SteamCaseCovers.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          Copy-Item dist\SteamCaseCovers.exe ${{ matrix.asset }}
      - name: Selftest (built app) - macOS
        if: runner.os == 'macOS'
        run: |
          # Apple Silicon refuses unsigned programs, and a downloaded unsigned app is reported as "damaged".
          # An ad-hoc signature (free, no Apple account) turns that into the normal "unidentified developer" prompt.
          xattr -cr dist/SteamCaseCovers.app
          codesign --force --deep --sign - dist/SteamCaseCovers.app
          codesign --verify --deep --strict --verbose=2 dist/SteamCaseCovers.app
          dist/SteamCaseCovers.app/Contents/MacOS/SteamCaseCovers --selftest
          ditto -c -k --keepParent dist/SteamCaseCovers.app ${{ matrix.asset }}
      - name: Selftest (built app) - Linux
        if: runner.os == 'Linux'
        run: |
          dist/SteamCaseCovers --selftest
          cp dist/SteamCaseCovers ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # lets GitHub sign the build certificates below
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Release notes (this version's section of docs/CHANGELOG.md; fails the release if there is none)
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/release_message.py body "$TAG" > release-notes.md
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Signed build provenance (who built each file, from which commit)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: assets/*
          body_path: release-notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}   # v0.x = pre-release until v1.0.0
      - name: Announce on Discord (skipped without the DISCORD_WEBHOOK_URL secret, and for pre-releases)
        if: ${{ !startsWith(github.ref_name, 'v0.') }}
        continue-on-error: true        # the release is already published: a Discord problem must not turn it red
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "No Discord webhook set: nothing to announce."; exit 0; fi
          python3 tools/release_message.py announce "$TAG" > discord.json
          curl --fail --silent --show-error -H "Content-Type: application/json" --data @discord.json "$DISCORD_WEBHOOK_URL"
